name: Build MyCAD Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: mycad-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prebuilt CAD runtime
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: mycad
          create-args: >-
            occt
          init-shell: powershell
          cache-environment: true
          cache-downloads: true
          post-cleanup: none

      - name: Configure
        shell: powershell
        run: |
          if (-not $env:CONDA_PREFIX) {
            throw "CONDA_PREFIX is not set."
          }

          $occtRoot = Join-Path $env:CONDA_PREFIX "Library"
          Write-Host "OCCT_ROOT=$occtRoot"

          cmake -S . -B build -A x64 `
            -DOCCT_ROOT="$occtRoot"

      - name: Build
        shell: powershell
        run: cmake --build build --config Release --parallel 2

      - name: Package portable runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\MyCAD.exe dist\MyCAD.exe -Force

          $libraryRoot = Join-Path $env:CONDA_PREFIX "Library"
          $runtimeBin = Join-Path $libraryRoot "bin"
          $pluginRoot = Join-Path $libraryRoot "plugins"

          if (-not (Test-Path $runtimeBin)) {
            throw "Runtime bin directory not found: $runtimeBin"
          }

          # Copy the complete native DLL set from the exact environment used
          # for linking. This includes Qt, OCCT, TBB, FreeType, compression
          # libraries and the Microsoft VC runtime.
          Get-ChildItem $runtimeBin -File -Filter "*.dll" |
            Copy-Item -Destination dist -Force

          # Qt searches for the Windows platform plugin at appdir/platforms.
          # Copy plugin groups manually because conda's Qt package does not
          # necessarily ship windeployqt.exe.
          $pluginGroups = @(
            "platforms",
            "styles",
            "imageformats",
            "iconengines",
            "generic",
            "networkinformation",
            "tls"
          )

          foreach ($group in $pluginGroups) {
            $source = Join-Path $pluginRoot $group
            if (Test-Path $source) {
              $destination = Join-Path $PWD "dist\$group"
              Copy-Item $source $destination -Recurse -Force
            }
          }

          $required = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "TKernel.dll",
            "TKV3d.dll",
            "TKOpenGl.dll",
            "TKBRep.dll",
            "TKDESTEP.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $PWD "dist\$file"))) {
              throw "Required runtime file missing: $file"
            }
          }

          $qwindows = Join-Path $PWD "dist\platforms\qwindows.dll"
          if (-not (Test-Path $qwindows)) {
            throw "Qt Windows platform plugin is missing: $qwindows"
          }

          Copy-Item README.md dist -Force
          Copy-Item THIRD_PARTY_NOTICES.md dist -Force

          Write-Host "Portable package assembled."
          Write-Host "Root DLL count: $((Get-ChildItem dist -File -Filter '*.dll').Count)"
          Write-Host "Total package size:"
          "{0:N1} MB" -f ((Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Inspect executable dependencies
        shell: powershell
        run: |
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Recurse -File -Filter "dumpbin.exe" |
            Where-Object { $_.FullName -match "Hostx64\\x64" } |
            Select-Object -First 1 -ExpandProperty FullName

          if ($dumpbin) {
            & $dumpbin /dependents dist\MyCAD.exe
          } else {
            Write-Host "dumpbin.exe not found; continuing to runtime smoke test."
          }

      - name: Smoke test MyCAD startup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "dist\MyCAD.exe"

          $process = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $PWD "dist") -PassThru
          Start-Sleep -Seconds 8

          if ($process.HasExited) {
            throw "MyCAD exited during startup smoke test. Exit code: $($process.ExitCode)"
          }

          Write-Host "MyCAD remained running for 8 seconds. Startup smoke test passed."
          Stop-Process -Id $process.Id -Force

      - name: Upload portable MyCAD
        uses: actions/upload-artifact@v4
        with:
          name: MyCAD-Windows-x64
          path: dist/
          if-no-files-found: error
          compression-level: 6
