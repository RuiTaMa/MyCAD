name: Build MyCAD Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: mycad-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_FEATURE_FLAGS: "manifests,binarycaching"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prebuilt Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          set-env: true

      - name: Clone vcpkg
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: powershell
        run: cmake --build build --config Release --parallel 2

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\MyCAD.exe dist\MyCAD.exe -Force

          $triplet = Join-Path $PWD "build\vcpkg_installed\x64-windows"
          $bin = Join-Path $triplet "bin"

          if (Test-Path $bin) {
            Get-ChildItem $bin -Filter "*.dll" | Copy-Item -Destination dist -Force
          }

          $windeploy = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $windeploy --release --compiler-runtime --no-translations (Join-Path $PWD "dist\MyCAD.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          # Bundle the Microsoft VC++ runtime explicitly.
          # Qt and OpenCASCADE are built with MSVC and require these DLLs on systems
          # that do not already have the matching VC++ Redistributable installed.
          $vsRoots = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC",
            "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Redist\MSVC",
            "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Redist\MSVC",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Redist\MSVC"
          )

          $crtDir = $null
          foreach ($root in $vsRoots) {
            if (Test-Path $root) {
              $latest = Get-ChildItem $root -Directory |
                Sort-Object Name -Descending |
                Select-Object -First 1
              if ($latest) {
                $candidate = Join-Path $latest.FullName "x64\Microsoft.VC143.CRT"
                if (Test-Path $candidate) {
                  $crtDir = $candidate
                  break
                }
              }
            }
          }

          if (-not $crtDir) {
            throw "Microsoft VC143 x64 runtime directory not found on runner."
          }

          Write-Host "Bundling VC++ runtime from: $crtDir"
          Copy-Item (Join-Path $crtDir "*.dll") dist -Force

          $requiredRuntime = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          foreach ($dll in $requiredRuntime) {
            if (-not (Test-Path (Join-Path $PWD "dist\$dll"))) {
              throw "Required runtime DLL missing from package: $dll"
            }
          }

          Copy-Item README.md dist -Force
          Copy-Item THIRD_PARTY_NOTICES.md dist -Force

      - name: Upload portable MyCAD
        uses: actions/upload-artifact@v4
        with:
          name: MyCAD-Windows-x64
          path: dist/
          if-no-files-found: error
