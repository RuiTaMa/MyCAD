name: Build MyCAD Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: mycad-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_FEATURE_FLAGS: "manifests,binarycaching"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prebuilt Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
          set-env: true

      - name: Clone vcpkg
        shell: powershell
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git .vcpkg
          .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$PWD/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: powershell
        run: cmake --build build --config Release --parallel 2

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\MyCAD.exe dist\MyCAD.exe -Force

          $triplet = Join-Path $PWD "build\vcpkg_installed\x64-windows"
          $bin = Join-Path $triplet "bin"

          if (Test-Path $bin) {
            Get-ChildItem $bin -Filter "*.dll" | Copy-Item -Destination dist -Force
          }

          $windeploy = (Get-Command windeployqt.exe -ErrorAction Stop).Source
          & $windeploy --release --compiler-runtime --no-translations (Join-Path $PWD "dist\MyCAD.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

          # Bundle Microsoft VC++ runtime explicitly.
          # Locate Visual Studio dynamically instead of assuming a fixed runner path.
          $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found on the GitHub runner."
          }

          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vsPath) {
            throw "Visual Studio C++ toolchain was not found."
          }

          Write-Host "Visual Studio: $vsPath"

          $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
          if (-not (Test-Path $redistRoot)) {
            throw "VC Redist root not found: $redistRoot"
          }

          $crtDir = Get-ChildItem $redistRoot -Directory -Recurse |
            Where-Object { $_.FullName -match "\\x64\\Microsoft\.VC14[0-9]\.CRT$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $crtDir) {
            # Fallback: locate vcruntime140.dll and use its containing directory.
            $runtimeDll = Get-ChildItem $redistRoot -File -Recurse -Filter "vcruntime140.dll" |
              Where-Object { $_.FullName -match "\\x64\\" } |
              Select-Object -First 1
            if ($runtimeDll) {
              $crtDir = $runtimeDll.Directory.FullName
            }
          }

          if (-not $crtDir) {
            throw "Microsoft VC++ x64 CRT directory could not be located under $redistRoot"
          }

          Write-Host "Bundling VC++ runtime from: $crtDir"
          Get-ChildItem $crtDir -File -Filter "*.dll" | Copy-Item -Destination dist -Force

          $requiredRuntime = @(
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          foreach ($dll in $requiredRuntime) {
            if (-not (Test-Path (Join-Path $PWD "dist\$dll"))) {
              throw "Required runtime DLL missing from package: $dll"
            }
          }

          Copy-Item README.md dist -Force
          Copy-Item THIRD_PARTY_NOTICES.md dist -Force

      - name: Upload portable MyCAD
        uses: actions/upload-artifact@v4
        with:
          name: MyCAD-Windows-x64
          path: dist/
          if-no-files-found: error
