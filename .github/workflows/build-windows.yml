name: Build MyCAD Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: mycad-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prebuilt CAD runtime
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: mycad
          create-args: >-
            occt
          init-shell: powershell
          cache-environment: true
          cache-downloads: true
          post-cleanup: none

      - name: Configure
        shell: powershell
        run: |
          if (-not $env:CONDA_PREFIX) {
            throw "CONDA_PREFIX is not set."
          }

          $occtRoot = Join-Path $env:CONDA_PREFIX "Library"
          Write-Host "OCCT_ROOT=$occtRoot"

          cmake -S . -B build -A x64 `
            -DOCCT_ROOT="$occtRoot"

      - name: Build
        shell: powershell
        run: cmake --build build --config Release --parallel 2

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\MyCAD.exe dist\MyCAD.exe -Force

          $runtimeBin = Join-Path $env:CONDA_PREFIX "Library\bin"
          if (-not (Test-Path $runtimeBin)) {
            throw "Runtime bin directory not found: $runtimeBin"
          }

          # Start with the conda runtime. This guarantees OCCT and the matching
          # MSVC runtime are packaged together.
          Get-ChildItem $runtimeBin -File -Filter "*.dll" |
            Copy-Item -Destination dist -Force

          # Deploy Qt plugins from the same conda environment.
          $windeploy = Join-Path $runtimeBin "windeployqt.exe"
          if (-not (Test-Path $windeploy)) {
            throw "windeployqt.exe not found: $windeploy"
          }

          & $windeploy --release --no-translations (Join-Path $PWD "dist\MyCAD.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed"
          }

          $required = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "TKernel.dll",
            "TKV3d.dll",
            "TKOpenGl.dll",
            "TKBRep.dll",
            "TKDESTEP.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path (Join-Path $PWD "dist\$file"))) {
              throw "Required runtime file missing: $file"
            }
          }

          if (-not (Test-Path (Join-Path $PWD "dist\platforms\qwindows.dll"))) {
            throw "Qt Windows platform plugin is missing."
          }

          Copy-Item README.md dist -Force
          Copy-Item THIRD_PARTY_NOTICES.md dist -Force

          Write-Host "MyCAD package ready."
          Write-Host "DLL count: $((Get-ChildItem dist -File -Filter '*.dll').Count)"
          Write-Host "Package size:"
          "{0:N1} MB" -f ((Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Upload portable MyCAD
        uses: actions/upload-artifact@v4
        with:
          name: MyCAD-Windows-x64
          path: dist/
          if-no-files-found: error
          compression-level: 6
